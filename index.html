    <script>
      (function() {
        try {
          var _nativeFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _nativeFetch;
            },
            set: function(val) {
              _nativeFetch = val;
            }
          });
        } catch (e) {}

        window.addEventListener('error', function(e) {
          if (e.filename && e.filename.indexOf('chrome-extension://') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
          if (e.message && e.message.indexOf('chrome-extension://') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
